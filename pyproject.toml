[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osc-senorge-plugin"
version = "0.1.0"
description = "seNorge 2018 daily temperature and precipitation as an installable Open Climate Service plugin."
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
authors = [{ name = "DHIS2 for Climate & Health" }]
keywords = ["open-climate-service", "senorge", "climate", "dhis2"]
dependencies = [
    "open-climate-service",
]

[project.urls]
Homepage = "https://github.com/MasterMaps/osc-senorge-plugin"
"Open Climate Service" = "https://github.com/dhis2/open-climate-service"

# Auto-discovered by Open Climate Service (dhis2/open-climate-service#118): the value
# is this plugin's top-level import package. OCS loads its datasets/*.yaml templates,
# and imports the ingestion plugin class by its dotted path at ingest time.
[project.entry-points."open_climate_service.plugins"]
senorge = "osc_senorge_plugin"

# `open-climate-service` is declared as a bare dependency with no VCS source pin: a
# plugin must not dictate which OCS revision an instance runs — the consuming instance
# supplies the source (git branch/tag/PyPI) via its own [tool.uv.sources]. (For local
# dev/CI of this plugin alone, install OCS explicitly, e.g. `uv pip install
# "open-climate-service @ git+https://github.com/dhis2/open-climate-service.git".)

[tool.hatch.build.targets.wheel]
packages = ["osc_senorge_plugin"]

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]
